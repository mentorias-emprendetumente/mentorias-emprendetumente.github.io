var QR8bitByte = R('./QR8bitByte');
var QRUtil = R('./QRUtil');
var QRPolynomial = R('./QRPolynomial');
var QRRSBlock = R('./QRRSBlock');
var QRBitBuffer = R('./QRBitBuffer');

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

};
return {QRCode:R('./index'),L:R('./QRErrorCorrectLevel').L};})();

/* recepción */
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:9px;padding:3px}

/* métricas */
.k-ok{--c:#2f6fd6}.k-no{--c:#e1251b}.k-ca{--c:#d99a00}
.kx-src{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:14px;color:var(--muted)}

.kx-t{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kx-t b{display:block;font-family:var(--display);font-size:32px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}

.kx-h{font-family:var(--display);font-size:22px;color:var(--navy);margin:20px 0 4px}
.kx-sub{font-size:14px;color:var(--muted);margin:0 0 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.kx-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kx-day{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.kx-day.best{border:2px solid var(--navy)}
.kx-day h4{margin:0;font-family:var(--display);font-size:20px;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.badge{font-family:var(--body);font-size:12px;background:var(--navy);color:#fff;padding:2px 8px;border-radius:99px}
.stack{display:flex;gap:2px;height:22px}
.stack div{background:var(--c);height:100%}
.stack div:first-child{border-radius:4px 0 0 4px}.stack div:last-child{border-radius:0 4px 4px 0}
.stack div:only-child{border-radius:4px}
.kx-nums{display:grid;grid-template-columns:repeat(3,1fr);font-size:13px;color:var(--muted);gap:4px}
.kx-nums b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.kx-occ{font-size:14px;color:var(--ink)}
table.kx{width:100%;border-collapse:collapse;font-size:14px}
table.kx th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:2px solid var(--line)}
table.kx td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
table.kx td.r,table.kx th.r{text-align:right}
.hbar{display:flex;align-items:center;gap:8px;min-width:160px}
.hbar span{display:block;height:12px;border-radius:0 4px 4px 0;background:#2f6fd6}
.hours{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;align-items:end;height:170px;border-bottom:1px solid var(--line);padding-top:22px}
.hours .col{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.hours .col div{background:#2f6fd6;border-radius:4px 4px 0 0;min-height:2px}

.hours .col em{position:absolute;left:0;right:0;text-align:center;font-style:normal;font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.hours .col.peak em{color:var(--navy)}
.hlab{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.ins div{border-left:4px solid var(--navy);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.45}
.ins b{color:var(--navy)}
.pl-top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pl-kpi{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.pl-kpi b{display:block;font-family:var(--display);font-size:26px;color:var(--navy);font-variant-numeric:tabular-nums}
.pl-kpi span{font-size:13px;color:var(--muted)}
.pl-f{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.pl-f select,.pl-f input[type=search]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;background:#fff}

table.pl{width:100%;border-collapse:collapse;font-size:15px}

table.pl tr.dayrow td{background:var(--navy);color:#fff;font-family:var(--display);font-size:18px;font-weight:700;padding:7px 10px}
table.pl tr.dayrow td small{font-family:var(--body);font-size:13px;font-weight:500;color:#cdd8ec;margin-left:8px}
table.pl td.nm{font-weight:700}
.pin{max-width:340px;margin:10px auto;text-align:center;display:grid;gap:16px}
.pin h2{font-family:var(--display);font-size:30px;color:var(--navy)}
.pin .dots{display:flex;justify-content:center;gap:14px}
.pin .dots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--navy)}

.lockbtn{border:none;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;margin-left:8px}

/* vista real: sin marcos, cada equipo a pantalla completa */
.fullbtn{background:var(--red)!important;border-color:var(--red)!important;font-weight:700}
.exitfull{display:none;position:fixed;bottom:10px;left:10px;z-index:50;border:none;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;background:rgba(0,0,0,.55);color:#fff;opacity:.35}

<body>

<header class="topbar">
  <div class="brand"><span class="logo-ph">LOGO COPEC</span> Mentorías · Emprende tu Mente</div>
  <nav class="views" aria-label="Vistas">
    <a href="#tablet" data-v="tablet">Tablet anfitriona</a>
    <a href="#mentor" data-v="mentor">Tablet mentor</a>

</header>

<main>
  <section class="view" id="v-tablet" aria-label="Tablet de la anfitriona">
    <div class="tablet"><div class="t-screen">
      <div class="t-head">
        <div><h1 id="tabTitle">Reserva tu mentoría gratis</h1><p id="tabSub">Sesiones 1 a 1 con expertos Copec</p></div>
        <div class="seg" role="group" aria-label="Sección de la tablet">
          <button type="button" data-s="reserva">Nueva reserva</button>
          <button type="button" data-s="turnos">Recepción</button>
          <button type="button" data-s="parrilla">Parrilla</button>
          <button type="button" data-s="plano">Plano general</button>
          <button type="button" data-s="kpi">Métricas</button>
        </div>
      </div>

      <div class="t-head">

        <div class="days" role="group" aria-label="Tablet de mesa" style="margin:0">

  </section>

</main>

<script>
(function(){
"use strict";
const DAYS=["Día 1","Día 2","Día 3"];
/* hora real de Santiago de Chile (respeta horario de verano), en segundos desde medianoche */
const TZF=new Intl.DateTimeFormat("es-CL",{timeZone:"America/Santiago",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
function realSantiagoSec(){const p={};TZF.formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return (+p.hour%24)*3600+(+p.minute)*60+(+p.second)}
/* modo presentación: si se abre fuera del horario de la feria (10:00 a 20:00), el reloj parte en 15:10 y avanza solo, para mostrar todo funcionando */
const REAL0=realSantiagoSec(), DEMO=REAL0<10*3600||REAL0>=20*3600, OFFSET=DEMO?(15*60+10)*60-REAL0:0;
function santiagoSec(){return ((realSantiagoSec()+OFFSET)%86400+86400)%86400}
const OPEN=10*60, CLOSE=20*60, GRACE=5, MAXCALLS=3;
const toMin=s=>{const [h,m]=String(s).split(":").map(Number);return h*60+(m||0)};
const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
let uid=100;

const MENTORS=[
  {id:1,name:"Valentina Rojas",spec:"Finanzas para emprender"},
  {id:2,name:"Matías Soto",spec:"Marketing digital"},
  {id:3,name:"Carolina Muñoz",spec:"Ventas B2B"},
  {id:4,name:"Diego Fuentes",spec:"Innovación y tecnología"},
  {id:5,name:"Fernanda Lagos",spec:"Modelo de negocio"}
];
const baseGrid=[[1,1,"10:00","14:00"],[1,2,"14:00","17:00"],[1,3,"17:00","20:00"],[2,4,"10:00","15:00"],[2,5,"15:00","20:00"]];
const S={
  day:0, sec:santiagoSec(), dur:20, allowOtherDays:false,
  mentors:MENTORS,
  grid:[0,1,2].flatMap(d=>baseGrid.map(([mesa,mid,from,to])=>({id:++uid,day:d,mesa,mid,from,to}))),
  bookings:[

  view:"tablet", kpiSrc:"ejemplo", hostTab:"reserva", pf:{day:"all",mesa:"all",q:"",all:false}, unlocked:false, pinTarget:"turnos", pinIn:"", pinErr:"", mt:1, mtDur:{1:20,2:20}, sure:null, banner:null,
  tab:{step:"pick",day:0,mesa:null,start:null,first:"",ini:"",email:"",ok:false,count:60}
};
[["Ignacio L.",1,1,"10:20"],["Paula S.",1,2,"10:40"],["Rodrigo N.",1,1,"11:40"],["Daniela F.",1,2,"15:20"],["Joaquín B.",1,1,"17:20"],["Catalina V.",2,2,"10:00"],["Felipe O.",2,1,"12:00"],["Javiera M.",2,2,"18:20"]].forEach(([name,day,mesa,t])=>S.bookings.push({id:++uid,day,mesa,start:toMin(t),name,email:"",status:"reservado",calls:0}));
const nowMin=()=>Math.floor(S.sec/60);
/* los datos de ejemplo del Día 1 se acomodan a la hora real, para que la demo siempre tenga sentido */
(function fitSeeds(){
  const n=nowMin(), seeds=S.bookings.filter(b=>b.day===0);
  if(n<OPEN){seeds.forEach(b=>{b.status="reservado";b.calls=0;b.startedAt=b.endsAt=b.endedAt=null});return}
  if(n>=CLOSE){seeds.forEach(b=>{if(b.status!=="liberado")b.status="finalizada";b.endedAt=(b.start+20)*60;b.startedAt=b.endsAt=null});return}
  const cur=OPEN+Math.floor((n-OPEN)/20)*20, off=cur-15*60;
  S.bookings=S.bookings.filter(b=>{if(b.day!==0)return true;b.start+=off;return b.start>=OPEN&&b.start+20<=CLOSE});
  S.bookings.filter(b=>b.day===0).forEach(b=>{if(b.status==="enmesa"){b.startedAt=b.start*60;b.endsAt=(b.start+20)*60}if(b.status==="finalizada")b.endedAt=(b.start+20)*60});
})();

/* ---------- lógica ---------- */
const mentorById=id=>S.mentors.find(m=>m.id===id)||{name:"Por confirmar",spec:""};
function blocks(day,mesa){return S.grid.filter(b=>b.day===day&&b.mesa===mesa).sort((a,b)=>toMin(a.from)-toMin(b.from))}
function blockAt(day,mesa,t){return blocks(day,mesa).find(b=>t>=toMin(b.from)&&t<toMin(b.to))}
function mentorAt(day,mesa,t){const b=blockAt(day,mesa,t);return b?mentorById(b.mid):null}
function slotsOf(b){const out=[];for(let t=toMin(b.from);t+S.dur<=toMin(b.to);t+=S.dur)out.push(t);return out}
const ACTIVE=b=>b.status!=="liberado"&&b.status!=="cancelada";
/* una sesión adelantada que terminó antes de su hora deja su cupo libre para otra persona */
const OCCUPIES=k=>ACTIVE(k)&&!(k.status==="finalizada"&&k.endedAt!=null&&k.endedAt<=k.start*60);
function bookingAt(day,mesa,t){return S.bookings.find(k=>k.day===day&&k.mesa===mesa&&k.start===t&&OCCUPIES(k))}
function activeSession(day,mesa){return S.bookings.find(k=>k.day===day&&k.mesa===mesa&&k.status==="enmesa")}
const WAITING=k=>k.status==="reservado"||k.status==="presente";
function startSession(k){
  const d=S.mtDur[k.mesa]||S.dur, slotEnd=(k.start+S.dur)*60;
  k.startedAt=S.sec;
  /* si entra antes de su hora: duración completa elegida por el mentor; si entra en su hora o tarde: hasta el fin de su cupo */
  k.endsAt=S.sec<k.start*60?S.sec+d*60:Math.min(S.sec+d*60,slotEnd);
  k.status="enmesa";
}
function upcoming(day,mesa,cs){return S.bookings.filter(b=>b.day===day&&b.mesa===mesa&&WAITING(b)&&b.start!==cs&&(b.start+S.dur)*60>S.sec).sort((a,b)=>a.start-b.start)}
function curSlot(day,mesa){if(day!==S.day)return null;for(const b of blocks(day,mesa))for(const t of slotsOf(b))if(S.sec>=t*60&&S.sec<(t+S.dur)*60)return t;return null}
function secsLeft(t){return (t+S.dur)*60-S.sec}
function bookable(day,t){if(day>S.day)return true;if(day<S.day)return false;return secsLeft(t)>=GRACE*60}
function canFree(k){return S.sec-k.start*60>=GRACE*60&&k.calls>=MAXCALLS}
function availableDays(){return S.allowOtherDays?[0,1,2].filter(d=>d>=S.day):[S.day]}
const STLAB={reservado:"Reservado",presente:"En el stand",enmesa:"En mentoría",finalizada:"Terminada",liberado:"No llegó · cupo liberado",cancelada:"Cancelada por recepción"};
function beep(){try{const C=new (window.AudioContext||window.webkitAudioContext)();[0,.22].forEach((d,i)=>{const o=C.createOscillator(),g=C.createGain();o.frequency.value=i?660:880;g.gain.setValueAtTime(.15,C.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,C.currentTime+d+.2);o.connect(g).connect(C.destination);o.start(C.currentTime+d);o.stop(C.currentTime+d+.21)})}catch(e){}}
function callPerson(k){k.calls++;S.banner={name:k.name,mesa:k.mesa,calls:k.calls,until:Date.now()+12000};beep()}
const bannerOn=()=>!!(S.banner&&S.banner.until>Date.now());

      <div class="row2">
        <div class="field"><label for="fFirst">Tu nombre</label><input type="text" id="fFirst" autocomplete="off" maxlength="20" value="${esc(T.first)}" placeholder="Camila"></div>
        <div class="field"><label for="fIni">Inicial apellido</label><input type="text" id="fIni" autocomplete="off" maxlength="1" value="${esc(T.ini)}" placeholder="R"></div>

    </div>`;

function updateConfirm(){
  const T=S.tab,btn=document.getElementById("confirm");
  if(btn)btn.disabled=!(T.first.trim().length>=2&&/^[a-záéíóúñ]$/i.test(T.ini.trim())&&T.ok&&(T.email===""||/^\S+@\S+\.\S+$/.test(T.email)));
}
function calendarLink(){
  const T=S.tab,m=mentorAt(T.day,T.mesa,T.start);
  const base=new Date();base.setDate(base.getDate()+(T.day-S.day));
  const ymd=base.getFullYear()+String(base.getMonth()+1).padStart(2,"0")+String(base.getDate()).padStart(2,"0");
  const hm=x=>String(Math.floor(x/60)).padStart(2,"0")+String(x%60).padStart(2,"0")+"00";
  const p=new URLSearchParams({action:"TEMPLATE",text:"Mentoría Copec con "+(m?m.name:"mentor")+" · Mesa "+T.mesa,dates:ymd+"T"+hm(T.start)+"/"+ymd+"T"+hm(T.start+S.dur),ctz:"America/Santiago",details:"Mentor: "+(m?m.name+" ("+m.spec+")":"")+". Mesa "+T.mesa+". Llega 5 min antes.",location:"Stand Copec, feria Emprende tu Mente"});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
function drawQR(){
  const box=document.getElementById("qr");if(!box)return;
  try{
    /* QR generado dentro de la página: no depende de internet */
    const q=new QRLIB.QRCode(-1,QRLIB.L);q.addData(calendarLink());q.make();
    const n=q.getModuleCount(),pad=4,size=n+pad*2;let d="";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+pad} ${r+pad}h1v1h-1z`;
    box.innerHTML=`<svg viewBox="0 0 ${size} ${size}" width="210" height="210" shape-rendering="crispEdges" role="img" aria-label="Código QR de tu cita"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }catch(e){box.innerHTML='<p class="note">No se pudo generar el QR.</p>'}
}

  document.querySelectorAll("[data-mt]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.mt===mesa));
  const cs=curSlot(day,mesa), act=activeSession(day,mesa);

    } else {
      const left=end-S.sec;
      h+=`<div class="who" style="color:var(--ok)">Mesa libre</div>
      <div><div class="timer-l">Le quedan a este turno</div><div class="timer" data-end="${end}">${mmss(left)}</div></div>

function timeOpts(sel){let o="";for(let t=OPEN;t<=CLOSE;t+=5){if(t%15&&t%20)continue;o+=`<option value="${fmt(t)}"${fmt(t)===sel?" selected":""}>${fmt(t)}</option>`}return o}
/* ---------- métricas ---------- */
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function exampleData(){
  const r=rng(42),out=[],dayF=[.72,.9,.63],boost={10:-.15,12:.12,13:.18,17:.1,18:.14};
  for(const d of [0,1,2])for(const mesa of [1,2])for(const b of blocks(d,mesa))for(const t of slotsOf(b)){
    const p=Math.min(.97,dayF[d]+(boost[Math.floor(t/60)]||0));if(r()>p)continue;
    const advance=d>0&&r()<.2, x=r();
    const status=advance?(x<.24?"liberado":x<.38?"cancelada":"finalizada"):(x<.08?"liberado":x<.13?"cancelada":"finalizada");
    const y=r();
    out.push({day:d,mesa,start:t,status,advance,source:status==="finalizada"&&!advance&&r()<.12?"mesa":"tablet",email:r()<.27,early:status==="finalizada"&&r()<.1,calls:status==="liberado"?3:status==="finalizada"?(y<.56?0:y<.86?1:2):0,mins:status==="finalizada"?Math.min(20,12+Math.floor(r()*10)):0});
  }
  return out;
}

  mins:b.status==="enmesa"&&b.startedAt!=null?Math.max(0,(S.sec-b.startedAt)/60):b.status==="finalizada"?(b.startedAt!=null&&b.endedAt!=null?Math.max(0,(b.endedAt-b.startedAt)/60):S.dur):0}))}

        <div class="ticks"><span>10:00</span><span>12:00</span><span>14:00</span><span>16:00</span><span>18:00</span><span>20:00</span></div>
        <div class="brow"><span class="lab">Mentor</span><span class="lab">Desde</span><span class="lab">Hasta</span><span></span></div>
        ${bl.map(b=>`<div class="brow"><select data-g="${b.id}" data-f="mid" aria-label="Mentor">${S.mentors.map(m=>`<option value="${m.id}"${m.id===b.mid?" selected":""}>${esc(m.name)}</option>`).join("")}</select><select data-g="${b.id}" data-f="from" aria-label="Desde">${timeOpts(b.from)}</select><select data-g="${b.id}" data-f="to" aria-label="Hasta">${timeOpts(b.to)}</select><button type="button" class="del" data-delg="${b.id}" aria-label="Quitar bloque">✕</button></div>`).join("")}
        ${bad.size?`<p class="warn">Hay bloques que se cruzan (en rojo). Corrige las horas.</p>`:gaps.length?`<p class="note">Sin mentor: ${gaps.join(", ")}</p>`:`<p class="okmsg">Mesa cubierta de 10:00 a 20:00</p>`}
        <button type="button" class="add" data-addg="${mesa}">+ Agregar bloque</button>
      </div>`;
    }
    h+=`<button type="button" class="add" id="copyDay">Copiar la parrilla de ${DAYS[S.day]} a los otros días</button>
      <p class="note">Las reservas quedan amarradas a mesa + hora. Si cambias el mentor de un bloque, la tablet, la pantalla y la tablet del mentor muestran el nombre nuevo al instante.</p></div></div>`;
  }
  el.innerHTML=h;
}

/* ---------- general ---------- */
const HINTS={
  tablet:"Tablet de la anfitriona: aquí reserva por la persona (o se la pasa), y en Recepción y Parrilla ayuda al mentor. Reserva un horario de prueba. Los cupos que ya empezaron pero tienen al menos 5 min libres aparecen como AHORA.",
  mentor:"Tablet del mentor (una por mesa): llama a la persona, márcala al llegar y controla el tiempo. Si la mesa queda libre, puede adelantar al siguiente. Con 3 llamados y 5 min de espera se activa \"Liberar cupo\".",
  pantalla:"Cuando un mentor llama a alguien, su nombre aparece en grande por unos segundos. En la feria el reloj usa la hora real de Santiago; fuera de 10:00 a 20:00 muestra que está cerrada.",
  turnos:"Recepción: la anfitriona marca quién llegó al stand, puede llamarlo a la pantalla para ayudar al mentor y cancelar una reserva.",
  pin:"Recepción y Parrilla piden PIN (demo: 1234). Al volver a \"Nueva reserva\" la tablet se bloquea sola, así la anfitriona puede pasársela al público sin riesgo.",
  kpi:"Métricas: resultados por día, por mentor, horas con más demanda y comportamiento del público. Cambia entre el ejemplo al cierre de la feria y los datos en vivo de la demo.",
  plano:"Plano general: todas las reservas de los 3 días con hora, mesa, mentor, nombre y estado. Se puede filtrar por día, mesa o buscar un nombre.",
  parrilla:"Parrilla: el día se arma eligiendo de listas, sin escribir horas. La barra muestra en rojo los bloques que se cruzan."
};
function renderAll(){
  document.querySelectorAll(".views a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===S.view?"page":"false"));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+S.view));
  document.getElementById("simDay").value=S.day;
  document.getElementById("hint").textContent=(DEMO?"Modo presentación: fuera del horario de la feria, el prototipo simula que son las 15:10 y el reloj avanza solo. ":"")+HINTS[S.view==="tablet"?(S.hostTab==="reserva"?"tablet":S.hostTab):S.view];
  updateClock();
  ({tablet:renderTablet,mentor:renderMentor,pantalla:renderTV})[S.view]();
}
function updateClock(){const s=S.sec;document.getElementById("simClock").textContent=fmt(Math.floor(s/60))+":"+String(s%60).padStart(2,"0")}
function updateCounters(){
  document.querySelectorAll("[data-end]").forEach(e=>{const r=+e.dataset.end-S.sec;e.textContent=mmss(r);if(e.classList.contains("timer"))e.classList.toggle("low",r<120)});
  document.querySelectorAll("[data-since]").forEach(e=>e.textContent=mmss(S.sec-+e.dataset.since));
}
function busy(){const a=document.activeElement;return a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)}
function softRender(){
  if(busy()){updateCounters();return}
  if(S.view==="tablet"&&S.hostTab==="reserva"&&S.tab.step!=="pick"){updateCounters();return}
  renderAll();
}
function route(){let v=(location.hash||"#tablet").slice(1);if(v==="recepcion"){v="tablet";S.hostTab=S.unlocked?"turnos":"pin";S.pinTarget="turnos"}S.view=["tablet","mentor","pantalla"].includes(v)?v:"tablet";S.sure=null;renderAll()}

/* reloj de la demo: avanza solo */
let lastMin=nowMin(),lastBanner=false;
setInterval(()=>{
  S.sec=santiagoSec();
  updateClock();
  if(S.view==="tablet"&&S.hostTab==="reserva"&&S.tab.step==="done"){S.tab.count--;const c=document.getElementById("cd");if(c)c.textContent="Si nadie toca la pantalla, vuelve al inicio en "+S.tab.count+" s";if(S.tab.count<=0){resetTablet();return}}
  const m=nowMin(),b=bannerOn();
  if(m!==lastMin||b!==lastBanner){lastMin=m;lastBanner=b;softRender()}else updateCounters();
},1000);

if(DEMO){document.getElementById("clockLab").textContent="Modo presentación · hora simulada:";document.getElementById("clockLab").title="Fuera del horario de la feria el prototipo simula que son las 15:10. Entre 10:00 y 20:00 usa la hora real de Santiago."}
function setFull(on){document.body.classList.toggle("full",on);try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}renderAll()}
document.getElementById("goFull").addEventListener("click",()=>setFull(true));
document.getElementById("exitFull").addEventListener("click",()=>setFull(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("full"))setFull(false)});
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("full"))setFull(false)});
document.getElementById("simDay").innerHTML=DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("");
document.getElementById("simDay").addEventListener("change",e=>{S.day=+e.target.value;resetTablet()});
window.addEventListener("hashchange",route);

/* tablet reservas */
const tb=document.getElementById("tabletBody");
tb.addEventListener("click",e=>{
  const T=S.tab;
  const d=e.target.closest("[data-day]");if(d){T.day=+d.dataset.day;renderTablet();return}
  const s=e.target.closest(".slot");if(s&&!s.disabled){T.mesa=+s.dataset.mesa;T.start=+s.dataset.t;T.step="form";renderTablet();setTimeout(()=>{const f=document.getElementById("fFirst");f&&f.focus()},30);return}
  if(e.target.closest("#back")){T.step="pick";renderTablet();return}
  if(e.target.closest("#finish")){resetTablet();return}
});
tb.addEventListener("input",e=>{
  const T=S.tab,id=e.target.id;
  if(id==="fFirst")T.first=e.target.value;
  if(id==="fIni")T.ini=e.target.value;
  if(id==="fMail")T.email=e.target.value.trim();
  if(id==="fOk")T.ok=e.target.checked;
  updateConfirm();
});
tb.addEventListener("change",e=>{if(e.target.id==="fOk"){S.tab.ok=e.target.checked;updateConfirm()}});
tb.addEventListener("submit",e=>{
  e.preventDefault();const T=S.tab;
  if(bookingAt(T.day,T.mesa,T.start)){T.step="pick";renderTablet();return}
  const f=T.first.trim();
  S.bookings.push({id:++uid,day:T.day,mesa:T.mesa,start:T.start,name:f.charAt(0).toUpperCase()+f.slice(1)+" "+T.ini.trim().toUpperCase()+".",email:T.email,status:"reservado",calls:0,source:"tablet",advance:T.day>S.day});
  T.step="done";T.count=60;document.activeElement&&document.activeElement.blur();renderTablet();
});

/* tablet mentor */
document.querySelectorAll("[data-mt]").forEach(b=>b.addEventListener("click",()=>{S.mt=+b.dataset.mt;renderMentor()}));
const mb=document.getElementById("mentorBody");
mb.addEventListener("click",e=>{
  const a=e.target.closest("[data-ma]");if(!a||a.disabled)return;
  const k=S.bookings.find(x=>x.id===+a.dataset.id);if(!k)return;
  if(a.dataset.ma==="call")callPerson(k);
  if(a.dataset.ma==="start"||a.dataset.ma==="startEarly"){if(!activeSession(k.day,k.mesa))startSession(k)}
  if(a.dataset.ma==="free")k.status="liberado";
  if(a.dataset.ma==="fin"){k.status="finalizada";k.endedAt=S.sec}
  lastBanner=bannerOn();renderMentor();
});
mb.addEventListener("click",e=>{const b=e.target.closest("[data-dur]");if(!b)return;
  const d=+b.dataset.dur;S.mtDur[S.mt]=d;
  const act=activeSession(S.day,S.mt);
  /* cambiar la duración también ajusta la sesión en curso */
  if(act&&act.startedAt!=null){const slotEnd=(act.start+S.dur)*60;act.endsAt=act.startedAt<act.start*60?act.startedAt+d*60:Math.min(act.startedAt+d*60,slotEnd)}
  renderMentor()});
mb.addEventListener("submit",e=>{
  e.preventDefault();
  const f=document.getElementById("wFirst").value.trim(),i=document.getElementById("wIni").value.trim();
  const cs=curSlot(S.day,S.mt);if(f.length<2||cs===null)return;
  if(activeSession(S.day,S.mt))return;
  S.bookings.push({id:++uid,day:S.day,mesa:S.mt,start:cs,name:f.charAt(0).toUpperCase()+f.slice(1)+(i?" "+i.toUpperCase()+".":""),email:"",status:"enmesa",calls:0,startedAt:S.sec,endsAt:(cs+S.dur)*60,source:"mesa"});
  document.activeElement&&document.activeElement.blur();renderMentor();
});

/* recepción */
document.querySelector(".seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const t=b.dataset.s;S.sure=null;
  if(t==="reserva"){S.unlocked=false;S.hostTab="reserva"}  /* al volver a reservas se bloquea solo, por si le pasa la tablet al público */
  else if(S.unlocked)S.hostTab=t;
  else{S.hostTab="pin";S.pinTarget=t;S.pinIn="";S.pinErr=""}
  renderAll()});
document.getElementById("tabSub").addEventListener("click",e=>{if(e.target.closest("#lockNow")){S.unlocked=false;S.hostTab="reserva";renderAll()}});
tb.addEventListener("submit",e=>{if(e.target.id!=="pinForm")return;e.preventDefault();e.stopImmediatePropagation();
  const a=document.getElementById("pinNew").value.trim(),b=document.getElementById("pinNew2").value.trim();
  if(!/^\d{4}$/.test(a))S.pinMsg="El PIN debe tener 4 números.";
  else if(a!==b)S.pinMsg="Los dos PIN no coinciden. Escríbelos de nuevo.";
  else{PIN=a;S.pinMsg="PIN guardado. Desde ahora se pide el nuevo PIN."}
  document.activeElement&&document.activeElement.blur();renderTablet()},true);
tb.addEventListener("click",e=>{const k=e.target.closest("[data-ks]");if(k){S.kpiSrc=k.dataset.ks;renderTablet()}});
tb.addEventListener("input",e=>{if(e.target.id==="pfQ"){S.pf.q=e.target.value;const r=document.getElementById("planoRows");if(r)r.innerHTML=planoRows()}});
tb.addEventListener("change",e=>{const id=e.target.id;if(!/^pf/.test(id))return;
  if(id==="pfDay")S.pf.day=e.target.value;if(id==="pfMesa")S.pf.mesa=e.target.value;if(id==="pfAll")S.pf.all=e.target.checked;
  const r=document.getElementById("planoRows");if(r)r.innerHTML=planoRows();e.target.blur()});
tb.addEventListener("click",e=>{const k=e.target.closest("[data-pin]");if(!k)return;const v=k.dataset.pin;
  if(v==="x"){S.hostTab="reserva";renderAll();return}
  if(v==="b")S.pinIn=S.pinIn.slice(0,-1);else if(S.pinIn.length<4)S.pinIn+=v;
  S.pinErr="";
  if(S.pinIn.length===4){if(S.pinIn===PIN){S.unlocked=true;S.hostTab=S.pinTarget;S.pinIn="";renderAll();return}S.pinErr="PIN incorrecto, intenta de nuevo";S.pinIn=""}
  renderPin()});
const rb=tb;
rb.addEventListener("click",e=>{
  const a=e.target.closest("[data-ra]");
  if(a){const k=S.bookings.find(x=>x.id===+a.dataset.id);if(!k)return;
    if(a.dataset.ra==="presente"){k.status="presente";S.sure=null}
    if(a.dataset.ra==="call"){callPerson(k);lastBanner=bannerOn();S.sure=null}
    if(a.dataset.ra==="cancel"){if(S.sure===k.id){k.status="cancelada";S.sure=null}else S.sure=k.id}
    renderRecepcion();return}
  if(e.target.closest("#swDays")){S.allowOtherDays=!S.allowOtherDays;renderRecepcion();return}
  const dg=e.target.closest("[data-delg]");if(dg){S.grid=S.grid.filter(g=>g.id!==+dg.dataset.delg);renderRecepcion();return}
  const dm=e.target.closest("[data-delm]");if(dm){const id=+dm.dataset.delm;if(S.grid.some(g=>g.mid===id)){dm.textContent="!";dm.title="Este mentor tiene bloques asignados";return}S.mentors=S.mentors.filter(m=>m.id!==id);renderRecepcion();return}
  if(e.target.closest("#addM")){S.mentors.push({id:++uid,name:"Nuevo mentor",spec:"Especialidad"});renderRecepcion();return}
  const ag=e.target.closest("[data-addg]");
  if(ag){const mesa=+ag.dataset.addg,bl=blocks(S.day,mesa),last=bl.length?bl[bl.length-1].to:"10:00";const st=Math.min(toMin(last),CLOSE-60);S.grid.push({id:++uid,day:S.day,mesa,mid:S.mentors[0]?S.mentors[0].id:0,from:fmt(st),to:fmt(Math.min(CLOSE,st+120))});renderRecepcion();return}
  if(e.target.closest("#copyDay")){const src=S.grid.filter(g=>g.day===S.day);S.grid=S.grid.filter(g=>g.day===S.day).concat([0,1,2].filter(d=>d!==S.day).flatMap(d=>src.map(g=>({...g,id:++uid,day:d}))));const b=e.target.closest("#copyDay");renderRecepcion();const nb=document.getElementById("copyDay");if(nb)nb.textContent="Listo: copiada a los otros días";return}
});
rb.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.g){const g=S.grid.find(x=>x.id===+t.dataset.g);if(g){g[t.dataset.f]=t.dataset.f==="mid"?+t.value:t.value;t.blur();renderRecepcion()}return}
  if(t.dataset.mm){const m=S.mentors.find(x=>x.id===+t.dataset.mm);if(m){m[t.dataset.f]=t.value;t.blur();renderRecepcion()}return}
  if(t.id==="durSel"){S.dur=+t.value;t.blur();renderRecepcion()}
});

route();
})();
</script>
</body>
</html>
